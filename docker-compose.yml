# Production deployment: MySQL + Voxora + Caddy (automatic HTTPS).
#
#   cp .env.example .env   # then fill in every value
#   docker compose up -d --build
#
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voxora_db
      MYSQL_USER: voxora
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      # Runs only when the database volume is first created.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=voxora_db;User=voxora;Password=${DB_PASSWORD};"
      AdminBootstrap__Username: ${ADMIN_USERNAME:-}
      AdminBootstrap__Password: ${ADMIN_PASSWORD:-}
      AdminBootstrap__Email: ${ADMIN_EMAIL:-}
      # Only Caddy can reach the app, so X-Forwarded-* headers can be trusted.
      ReverseProxy__Enabled: "true"
    volumes:
      - keys:/keys
    # Not published: only reachable through Caddy.
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  keys:
  caddy-data:
  caddy-config:
